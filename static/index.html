<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Search</title>
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1c1a; --muted: #6b6860;
    --line: #e3e0d8; --accent: #2f6f4f; --bar: #d9e8df; --bad: #a33a2b; --chip: #eef3ef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --card: #1e201d; --ink: #ecebe6; --muted: #9a978f;
            --line: #30332e; --accent: #7cc39b; --bar: #2a3a31; --bad: #e08070; --chip: #263029; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: var(--accent); }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: vertical; min-height: 52px; padding: 12px; font: inherit;
             color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; }
  form button { padding: 0 20px; border: 0; background: var(--accent); color: var(--bg); font-weight: 600; }
  form button:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 28px; }
  .examples button { padding: 4px 10px; font-size: .85rem; color: var(--muted);
                     background: transparent; border: 1px solid var(--line); }
  .examples button:hover { color: var(--ink); border-color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 12px;
          display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 18px; align-items: start; }
  .card figure { margin: 0; }
  /* Paleoart ships on white backgrounds; keep a white tile in dark mode too. */
  .card figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain;
                     background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  .card figcaption { font-size: .68rem; color: var(--muted); margin-top: 4px; line-height: 1.3; }
  .card figcaption a { color: inherit; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .head h2 { margin: 0; font-size: 1.15rem; }
  .score { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; margin: 8px 0 12px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .chip.bad { color: var(--bad); background: transparent; border: 1px solid currentColor; }
  .chip.miss { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
  .desc { margin: 0; color: var(--muted); font-size: .92rem; }
  .meta { font-size: .78rem; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); }
  @media (max-width: 520px) {
    form { flex-direction: column; } form button { padding: 12px; }
    .card { grid-template-columns: minmax(0, 1fr) 104px; gap: 12px; }
  }
</style>
</head>
<body>
<main>
  <h1>Dino Search</h1>
  <p class="sub">Descreva a aparência de um dinossauro e veja os mais parecidos. <a href="/all">Ver todos</a></p>

  <form id="f">
    <textarea id="q" aria-label="Descrição física do dinossauro" placeholder="ex.: quadrúpede enorme com placas nas costas e espinhos na cauda" required></textarea>
    <button id="go" type="submit">Buscar</button>
  </form>

  <div class="examples" id="ex"></div>
  <div id="out" aria-live="polite"></div>
</main>

<script>
const EXAMPLES = [
  "quadrúpede enorme com placas nas costas e espinhos na cauda",
  "parece um pato grande",
  "carnívoro grande sem penas e sem vela",
  "três chifres e um escudo no pescoço",
  "tanque de guerra com martelo no rabo",
  "pequeno, com penas e uma garra curva no pé",
];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const label = (t) => t.replaceAll("_", " ");
let credits = {};
fetch("/img/credits.json").then((r) => r.json()).then((c) => { credits = c; }).catch(() => {});

for (const e of EXAMPLES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = e;
  b.onclick = () => { $("q").value = e; search(); };
  $("ex").append(b);
}

function card(h) {
  const chips = [
    ...h.tracos_correspondentes.map((t) => `<span class="chip">${esc(label(t))}</span>`),
    ...h.tracos_conflitantes.map((t) => `<span class="chip bad" title="conflita com a descrição">${esc(label(t))}</span>`),
    ...h.tracos_nao_correspondentes.map((t) => `<span class="chip miss" title="não tem">${esc(label(t))}</span>`),
  ].join("");
  const pct = Math.round(h.similaridade * 100);
  const c = credits[h.nome];
  const credit = c ? `<figcaption>${esc(c.autor)} · <a href="${esc(c.fonte)}" target="_blank" rel="noopener">${esc(c.licenca)}</a></figcaption>` : "";
  return `<article class="card">
    <div>
      <div class="head"><h2>${esc(h.nome)}</h2><span class="score">${pct}%</span></div>
      <div class="bar" role="meter" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
      <p class="desc">${esc(h.descricao_fisica)}</p>
      <div class="meta">final ${h.score_final.toFixed(3)} · embedding ${h.score_embedding.toFixed(3)} · atributos ${h.score_atributos.toFixed(2)}${h.penalidade ? ` · penalidade ${h.penalidade}` : ""}</div>
    </div>
    <figure>
      <img src="/img/${encodeURIComponent(h.nome)}.png" alt="Ilustração de ${esc(h.nome)}" loading="lazy" onerror="this.parentElement.remove()">
      ${credit}
    </figure>
  </article>`;
}

async function search() {
  const query = $("q").value.trim();
  if (!query) return;
  $("go").disabled = true;
  try {
    const r = await fetch("/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, top_k: 5 }),
    });
    if (!r.ok) throw new Error(`erro ${r.status}`);
    $("out").innerHTML = (await r.json()).map(card).join("");
  } catch (e) {
    $("out").innerHTML = `<p class="err">Falha na busca: ${esc(e.message)}</p>`;
  } finally {
    $("go").disabled = false;
  }
}

$("f").onsubmit = (e) => { e.preventDefault(); search(); };
$("q").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); search(); } };
</script>
</body>
</html>
